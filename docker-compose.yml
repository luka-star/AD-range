name: ad-range

# =================================================================================================
#  Gameserver infrastructure for the VM-based deployment.
#
#  Runs ONLY the gameserver itself (DB, web, controller, submission, two checkers) on the `gs` VM.
#  The vulnboxes are separate VMs, each running FakeBook's own dist/docker-compose.yaml, reachable
#  at 10.60.1.2 / 10.60.2.2 on the host-only game network. The checkers reach them over that
#  network through the VM's own routing (CTF_IPPATTERN -> 10.60.N.2).
#
#  Docker's internal network uses 172.20.0.0/24 so it does NOT clash with the host-only
#  10.60.0.0/16 game network the gs VM sits on. Services find each other by name (Docker DNS).
# =================================================================================================

x-gs-build: &gs-build
  context: ./gameserver

x-gs-db-env: &gs-db-env
  CTF_DBHOST: gs-postgres
  CTF_DBPORT: "5432"
  CTF_DBNAME: ctf
  CTF_DBUSER: ctf
  CTF_DBPASSWORD: ctf
  CTF_LOGLEVEL: INFO

services:
  # ---- Gameserver database ----------------------------------------------------------------------
  gs-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ctf
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf
    volumes:
      - gs-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [infra]

  # ---- One-shot: migrate schema, create admin, seed game/teams/services --------------------------
  gs-init:
    build: *gs-build
    image: ad-range/gameserver
    command: ["init"]
    environment:
      <<: *gs-db-env
      DJANGO_SUPERUSER_PASSWORD: ${WEB_ADMIN_PASSWORD:-admin}
      WEB_ADMIN_USER: admin
      SIM_TICK_DURATION: ${SIM_TICK_DURATION:-60}
      CTF_WEB_SECRET_KEY: sim-only-not-secret
    volumes:
      - gs-data:/data
    depends_on:
      gs-postgres:
        condition: service_healthy
    networks: [infra]

  # ---- Web: scoreboard, /admin, teams.json ------------------------------------------------------
  web:
    image: ad-range/gameserver
    command: ["web"]
    environment:
      <<: *gs-db-env
      CTF_WEB_SECRET_KEY: sim-only-not-secret
    volumes:
      - gs-data:/data
    ports:
      - "8000:8000"
    depends_on:
      gs-init:
        condition: service_completed_successfully
    networks: [infra]

  # ---- Controller: the clock --------------------------------------------------------------------
  controller:
    image: ad-range/gameserver
    command: ["controller"]
    environment:
      <<: *gs-db-env
    depends_on:
      gs-init:
        condition: service_completed_successfully
    networks: [infra]

  # ---- Submission: flag submission TCP server ---------------------------------------------------
  submission:
    image: ad-range/gameserver
    command: ["submission"]
    environment:
      <<: *gs-db-env
      CTF_LISTEN: 0.0.0.0:6666
      CTF_FLAGSECRET: ${CTF_FLAGSECRET}
      CTF_TEAMREGEX: '^10\.66\.(\d+)\.\d+$$'
    ports:
      - "6666:6666"
    depends_on:
      gs-init:
        condition: service_completed_successfully
    networks: [infra]

  # ---- Checker master for FakeBook store 1 ------------------------------------------------------
  checker1:
    image: ad-range/gameserver
    command: ["checker"]
    environment:
      <<: *gs-db-env
      CTF_SERVICE: fakebook_checker1
      CTF_CHECKERSCRIPT: /opt/checker-wrapper.sh
      CHECKER_DIR: /checkers/checker1
      CTF_CHECKERCOUNT: "1"
      CTF_INTERVAL: "15"
      CTF_IPPATTERN: "10.60.%s.2"
      CTF_FLAGSECRET: ${CTF_FLAGSECRET}
    volumes:
      - "${CHECKERS_DIR}:/checkers:ro"
    depends_on:
      gs-init:
        condition: service_completed_successfully
    networks: [infra]

  # ---- Checker master for FakeBook store 2 ------------------------------------------------------
  checker2:
    image: ad-range/gameserver
    command: ["checker"]
    environment:
      <<: *gs-db-env
      CTF_SERVICE: fakebook_checker2
      CTF_CHECKERSCRIPT: /opt/checker-wrapper.sh
      CHECKER_DIR: /checkers/checker2
      CTF_CHECKERCOUNT: "1"
      CTF_INTERVAL: "15"
      CTF_IPPATTERN: "10.60.%s.2"
      CTF_FLAGSECRET: ${CTF_FLAGSECRET}
    volumes:
      - "${CHECKERS_DIR}:/checkers:ro"
    depends_on:
      gs-init:
        condition: service_completed_successfully
    networks: [infra]

volumes:
  gs-pg-data:
  gs-data:

networks:
  infra:
    ipam:
      config: [{ subnet: 172.20.0.0/24 }]
